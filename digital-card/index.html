<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d5c95">
<title>邱瀚生｜品臻鋼鐵</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
:root{--blue:#1268a8;--dark:#0b273b;--line:#06c755}
*{box-sizing:border-box}
html,body{margin:0;background:#061521;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;color:#12384f}
.app{min-height:100svh;max-width:560px;margin:auto;background:#f4f8fa}
.head{background:linear-gradient(135deg,#0a3e68,#167fc1);color:#fff;padding:calc(env(safe-area-inset-top) + 22px) 22px 24px}
.brand{display:flex;align-items:center;gap:12px}.logo{width:55px;height:55px;object-fit:contain;background:#fff;border-radius:12px;padding:4px}
.brand small{display:block;letter-spacing:1px;font-size:10px;opacity:.85}.brand b{display:block;font-size:20px;margin-top:3px}
.person{display:flex;align-items:center;gap:17px;margin-top:25px}.portrait{width:112px;height:112px;border-radius:50%;object-fit:cover;object-position:center 18%;border:4px solid #fff;box-shadow:0 10px 26px #0007}
.name{font-size:34px;font-weight:900;letter-spacing:3px}.role{font-size:16px;margin-top:5px;opacity:.88}
.box{margin:-8px 14px 0;background:#fff;border-radius:20px;padding:13px 17px 20px;box-shadow:0 10px 32px #0822381f}
.row{display:grid;grid-template-columns:27px 76px 1fr;gap:4px;padding:11px 0;border-bottom:1px solid #e1edf2;font-size:14px}.row:last-child{border:0}.row b{color:#688291}.row a,.row span{color:#153e57;text-decoration:none;font-weight:700}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:13px}.btn{border:0;border-radius:12px;min-height:55px;padding:9px;color:#fff;font-weight:800;font-size:14px;background:#1268a8;text-decoration:none;display:flex;align-items:center;justify-content:center;text-align:center;cursor:pointer;font-family:inherit}.btn:first-child{grid-column:1/-1;background:#0fa54d}.btn.alt{background:#e2f1fb;color:#12507a}.btn.line{background:#06c755;color:#fff}.btn:active{transform:scale(.98)}
.notice{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);opacity:0;transition:.2s;background:#0c3049;color:#fff;border-radius:22px;padding:11px 15px;font-size:13px;white-space:nowrap;z-index:10000}.notice.on{opacity:1;transform:translate(-50%,0)}
@media(min-width:600px){.app{margin:24px auto;border-radius:28px;overflow:hidden;box-shadow:0 25px 70px #0008}}
</style>
</head>
<body>
<main class="app">
<section class="head">
  <div class="brand"><img class="logo" src="../pj-logo.png" alt="PJ"><div><small>PIIN JEN STEEL CO., LTD.</small><b>品臻鋼鐵有限公司</b></div></div>
  <div class="person"><img class="portrait" src="../2172-20090112.jpg" alt="邱瀚生"><div><div class="name">邱瀚生</div><div class="role">經理</div></div></div>
</section>
<section class="box">
  <div class="row"><i>📱</i><b>手機</b><a href="tel:0930376769">0930-376-769</a></div>
  <div class="row"><i>✉</i><b>Email</b><a href="mailto:dior85200@gmail.com">dior85200@gmail.com</a></div>
  <div class="row"><i>☎</i><b>公司電話</b><a href="tel:0423359496">04-2335-9496</a></div>
  <div class="row"><i>▣</i><b>公司傳真</b><span>04-2335-9499</span></div>
  <div class="row"><i>⌖</i><b>地址</b><a href="https://www.google.com/maps/search/?api=1&query=臺中市烏日區北里里太明路成豐巷43號">臺中市烏日區北里里太明路成豐巷43號</a></div>
  <div class="actions">
    <button class="btn" onclick="shareCard()">🤝 分享原生名片</button>
    <button class="btn alt" onclick="saveContact()">💾 存入通訊錄</button>
    <a class="btn alt" href="mailto:dior85200@gmail.com">✉ 寄送 Email</a>
    <a class="btn alt" href="https://www.google.com/maps/search/?api=1&query=臺中市烏日區北里里太明路成豐巷43號">⌖ Google 地圖</a>
    <a class="btn line" href="https://line.me/ti/p/AsuzISXPi8">🟢 加入 LINE 好友</a>
  </div>
</section>
</main>
<div id="n" class="notice"></div>
<script>
const LIFF_ID="2011231923-J7yjFBB8";
const cardUrl="https://liff.line.me/2011231923-J7yjFBB8";
const shareUrl="https://liff.line.me/2011231923-J7yjFBB8?action=share";
const photo="https://dior85200.github.io/-/2172-20090112.jpg";
const logo="https://dior85200.github.io/-/pj-logo.png";
const personalLineUrl="https://line.me/ti/p/AsuzISXPi8";

let liffReady=false;
const ready=(async()=>{try{await liff.init({liffId:LIFF_ID});liffReady=true;return true}catch(e){console.error(e);return false}})();

function note(text){const n=document.getElementById("n");n.textContent=text;n.classList.add("on");clearTimeout(window.__noteTimer);window.__noteTimer=setTimeout(()=>n.classList.remove("on"),2600)}

function makeFlex(){
  return {
    type:"flex",
    altText:"邱瀚生｜品臻鋼鐵有限公司 數位名片",
    contents:{
      type:"bubble",
      hero:{type:"image",url:photo,size:"full",aspectRatio:"4:5",aspectMode:"cover"},
      body:{type:"box",layout:"vertical",contents:[
        {type:"text",text:"品臻鋼鐵有限公司",weight:"bold",size:"lg",color:"#1268A8"},
        {type:"text",text:"邱瀚生｜經理",weight:"bold",size:"xxl",margin:"md",color:"#123B5C"},
        {type:"separator",margin:"md"},
        {type:"box",layout:"vertical",margin:"md",spacing:"sm",contents:[
          {type:"text",text:"手機　0930-376-769",size:"sm"},
          {type:"text",text:"Email　dior85200@gmail.com",size:"sm",wrap:true},
          {type:"text",text:"公司電話　04-2335-9496",size:"sm"},
          {type:"text",text:"臺中市烏日區北里里太明路成豐巷43號",size:"xs",color:"#607D8B",wrap:true}
        ]}
      ]},
      footer:{type:"box",layout:"vertical",spacing:"sm",contents:[
        {type:"button",style:"primary",color:"#1268A8",action:{type:"uri",label:"開啟數位名片",uri:cardUrl}},
        {type:"box",layout:"horizontal",spacing:"sm",contents:[
          {type:"button",style:"secondary",action:{type:"uri",label:"傳送名片",uri:shareUrl}},
          {type:"button",style:"secondary",action:{type:"uri",label:"加入好友",uri:personalLineUrl}}
        ]},
        {type:"box",layout:"horizontal",spacing:"sm",contents:[
          {type:"button",style:"secondary",action:{type:"uri",label:"立即致電",uri:"tel:0930376769"}},
          {type:"button",style:"secondary",action:{type:"uri",label:"Google 地圖",uri:"https://www.google.com/maps/search/?api=1&query=%E8%87%BA%E4%B8%AD%E5%B8%82%E7%83%8F%E6%97%A5%E5%8D%80%E5%8C%97%E9%87%8C%E9%87%8C%E5%A4%AA%E6%98%8E%E8%B7%AF%E6%88%90%E8%B1%90%E5%B7%B743%E8%99%9F"}}
        ]}
      ]}
    }
  };
}

async function shareCard(){
  const ok=await ready;
  if(!ok||!liffReady||!liff.isApiAvailable("shareTargetPicker")){note("此環境不支援 LINE 分享");return}
  try{
    const result=await liff.shareTargetPicker([makeFlex()],{isMultiple:true});
    if(result&&result.status==="success")note("名片卡已送出");
    else note("已取消分享");
  }catch(e){console.error(e);note("分享失敗，請確認 LINE 分享功能已啟用");}
}

function saveContact(){
  const vcard=[
    "BEGIN:VCARD","VERSION:3.0","N:邱瀚生;;;","FN:邱瀚生","ORG:品臻鋼鐵有限公司","TITLE:經理","TEL;TYPE=CELL:0930376769","TEL;TYPE=WORK:0423359496","EMAIL;TYPE=INTERNET:dior85200@gmail.com","ADR;TYPE=WORK:;;臺中市烏日區北里里太明路成豐巷43號;;;;","END:VCARD"
  ].join("\r\n");
  const blob=new Blob([vcard],{type:"text/vcard;charset=utf-8"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");a.href=url;a.download="邱瀚生_品臻鋼鐵.vcf";document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);
  note("已準備通訊錄檔案");
}

ready.then(()=>{
  const action=new URLSearchParams(location.search).get("action");
  if(action==="share"){
    setTimeout(()=>shareCard(),350);
  }
});
</script>
</body>
</html>
