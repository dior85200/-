<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d5c95">
<title>邱瀚生｜品臻鋼鐵</title>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

<style>
:root{
  --blue:#1268a8;
  --dark:#0b273b;
  --light:#edf6fa;
  --line:#06c755;
}

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  background:#061521;
  font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;
  color:#12384f;
}

.app{
  min-height:100svh;
  max-width:560px;
  margin:auto;
  background:#f4f8fa;
}

.head{
  background:linear-gradient(135deg,#0a3e68,#167fc1);
  color:#fff;
  padding:calc(env(safe-area-inset-top) + 22px) 22px 24px;
}

.brand{
  display:flex;
  align-items:center;
  gap:12px;
}

.logo{
  width:55px;
  height:55px;
  object-fit:contain;
  background:#fff;
  border-radius:12px;
  padding:4px;
}

.brand small{
  display:block;
  letter-spacing:1px;
  font-size:10px;
  opacity:.85;
}

.brand b{
  display:block;
  font-size:20px;
  margin-top:3px;
}

.person{
  display:flex;
  align-items:center;
  gap:17px;
  margin-top:25px;
}

.portrait{
  width:112px;
  height:112px;
  border-radius:50%;
  object-fit:cover;
  object-position:center 18%;
  border:4px solid #fff;
  box-shadow:0 10px 26px #0007;
}

.name{
  font-size:34px;
  font-weight:900;
  letter-spacing:3px;
}

.role{
  font-size:16px;
  margin-top:5px;
  opacity:.88;
}

.box{
  margin:-8px 14px 0;
  background:#fff;
  border-radius:20px;
  padding:13px 17px 20px;
  box-shadow:0 10px 32px #0822381f;
}

.row{
  display:grid;
  grid-template-columns:27px 76px 1fr;
  gap:4px;
  padding:11px 0;
  border-bottom:1px solid #e1edf2;
  font-size:14px;
}

.row:last-child{
  border:0;
}

.row b{
  color:#688291;
}

.row a,
.row span{
  color:#153e57;
  text-decoration:none;
  font-weight:700;
}

/* =========================
   按鈕區
========================= */

.actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
  margin-top:13px;
}

.btn{
  border:0;
  border-radius:12px;
  min-height:55px;
  padding:9px;
  color:#fff;
  font-weight:800;
  font-size:14px;
  background:#1268a8;
  text-decoration:none;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  cursor:pointer;
  font-family:inherit;
}

.btn:first-child{
  grid-column:1/-1;
  background:#0fa54d;
}

.btn.alt{
  background:#e2f1fb;
  color:#12507a;
}

/* LINE 按鈕 */

.btn.line{
  background:#06c755;
  color:#fff;
}

.btn.line:active{
  transform:scale(.98);
}

/* =========================
   LINE 好友視窗
========================= */

.line-overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.48);
  backdrop-filter:blur(5px);
  -webkit-backdrop-filter:blur(5px);

  display:flex;
  align-items:center;
  justify-content:center;

  padding:20px;

  opacity:0;
  visibility:hidden;
  pointer-events:none;

  transition:.25s ease;

  z-index:9999;
}

.line-overlay.show{
  opacity:1;
  visibility:visible;
  pointer-events:auto;
}

.line-card{
  width:100%;
  max-width:360px;
  background:#fff;
  border-radius:24px;
  padding:25px 22px 22px;
  text-align:center;

  box-shadow:
    0 20px 60px rgba(0,0,0,.28);

  transform:translateY(15px) scale(.96);
  transition:.25s ease;
}

.line-overlay.show .line-card{
  transform:translateY(0) scale(1);
}

.line-icon{
  width:68px;
  height:68px;
  margin:0 auto 12px;

  border-radius:50%;

  background:#06c755;
  color:#fff;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:34px;
  font-weight:900;
}

.line-title{
  font-size:23px;
  font-weight:900;
  color:#12384f;
  margin-bottom:8px;
}

.line-description{
  font-size:14px;
  line-height:1.7;
  color:#6b7d87;
  margin-bottom:18px;
}

.line-id-box{
  background:#f1f7f4;
  border:1px solid #d8eee1;
  border-radius:14px;
  padding:14px 12px;
  margin-bottom:15px;
}

.line-id-label{
  display:block;
  font-size:12px;
  color:#6d8178;
  margin-bottom:4px;
}

.line-id{
  display:block;
  font-size:23px;
  font-weight:900;
  letter-spacing:1px;
  color:#12384f;
}

.line-actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
}

.line-action{
  border:0;
  border-radius:12px;
  min-height:48px;
  padding:8px;
  font-family:inherit;
  font-size:14px;
  font-weight:800;
  cursor:pointer;
}

.line-open{
  background:#06c755;
  color:#fff;
}

.line-copy{
  background:#e2f1fb;
  color:#12507a;
}

.line-close{
  width:100%;
  border:0;
  background:transparent;
  color:#78909c;
  font-family:inherit;
  font-size:14px;
  font-weight:700;
  margin-top:13px;
  padding:8px;
  cursor:pointer;
}

/* =========================
   提示訊息
========================= */

.notice{
  position:fixed;
  left:50%;
  bottom:22px;

  transform:translate(-50%,20px);

  opacity:0;

  transition:.2s;

  background:#0c3049;
  color:#fff;

  border-radius:22px;

  padding:11px 15px;

  font-size:13px;

  white-space:nowrap;

  z-index:10000;
}

.notice.on{
  opacity:1;
  transform:translate(-50%,0);
}

/* =========================
   電腦版
========================= */

@media(min-width:600px){

  .app{
    margin:24px auto;
    border-radius:28px;
    overflow:hidden;
    box-shadow:0 25px 70px #0008;
  }

}
</style>
</head>

<body>

<main class="app">

  <!-- =========================
       上方公司 / 個人資料
  ========================== -->

  <section class="head">

    <div class="brand">

      <img
        class="logo"
        src="../pj-logo.png"
        alt="PJ"
      >

      <div>
        <small>PIIN JEN STEEL CO., LTD.</small>
        <b>品臻鋼鐵有限公司</b>
      </div>

    </div>


    <div class="person">

      <img
        class="portrait"
        src="../2172-20090112.jpg"
        alt="邱瀚生"
      >

      <div>

        <div class="name">
          邱瀚生
        </div>

        <div class="role">
          經理
        </div>

      </div>

    </div>

  </section>


  <!-- =========================
       聯絡資料
  ========================== -->

  <section class="box">

    <div class="row">

      <i>📱</i>

      <b>手機</b>

      <a href="tel:0930376769">
        0930-376-769
      </a>

    </div>


    <div class="row">

      <i>✉</i>

      <b>Email</b>

      <a href="mailto:dior85200@gmail.com">
        dior85200@gmail.com
      </a>

    </div>


    <div class="row">

      <i>☎</i>

      <b>公司電話</b>

      <a href="tel:0423359496">
        04-2335-9496
      </a>

    </div>


    <div class="row">

      <i>▣</i>

      <b>公司傳真</b>

      <span>
        04-2335-9499
      </span>

    </div>


    <div class="row">

      <i>⌖</i>

      <b>地址</b>

      <a
        href="https://www.google.com/maps/search/?api=1&query=臺中市烏日區北里里太明路成豐巷43號"
      >
        臺中市烏日區北里里太明路成豐巷43號
      </a>

    </div>


    <!-- =========================
         功能按鈕
    ========================== -->

    <div class="actions">

      <!-- 分享原生名片 -->

      <button
        class="btn"
        onclick="shareCard()"
      >
        🤝 分享原生名片
      </button>


      <!-- 存入通訊錄 -->

      <button
        class="btn alt"
        onclick="saveContact()"
      >
        💾 存入通訊錄
      </button>


      <!-- Email -->

      <a
        class="btn alt"
        href="mailto:dior85200@gmail.com"
      >
        ✉ 寄送 Email
      </a>


      <!-- Google 地圖 -->

      <a
        class="btn alt"
        href="https://www.google.com/maps/search/?api=1&query=臺中市烏日區北里里太明路成豐巷43號"
      >
        ⌖ Google 地圖
      </a>


      <!-- =========================
           LINE 好友
           你的個人 LINE ID
           ========================== -->

      <button
        class="btn line"
        onclick="openLineFriend()"
      >
        🟢 加入 LINE 好友
      </button>

    </div>

  </section>

</main>


<!-- =========================
     LINE 好友彈出視窗
========================== -->

<div
  id="lineOverlay"
  class="line-overlay"
  onclick="closeLineFriend(event)"
>

  <div
    class="line-card"
    onclick="event.stopPropagation()"
  >

    <div class="line-icon">
      LINE
    </div>


    <div class="line-title">
      加入 LINE 好友
    </div>


    <div class="line-description">
      請使用 LINE 搜尋我的 LINE ID，
      <br>
      即可加入好友。
    </div>


    <div class="line-id-box">

      <span class="line-id-label">
        LINE ID
      </span>

      <span
        id="lineId"
        class="line-id"
      >
        dior85200
      </span>

    </div>


    <div class="line-actions">

      <!-- 開啟 LINE -->

      <button
        class="line-action line-open"
        onclick="openLINEApp()"
      >
        💬 開啟 LINE
      </button>


      <!-- 複製 ID -->

      <button
        class="line-action line-copy"
        onclick="copyLineID()"
      >
        📋 複製 ID
      </button>

    </div>


    <button
      class="line-close"
      onclick="closeLineFriend()"
    >
      關閉
    </button>

  </div>

</div>


<!-- =========================
     通知
========================== -->

<div
  id="n"
  class="notice"
></div>


<script>

/* ========================================
   基本資料
======================================== */

const cardUrl =
  "https://liff.line.me/2011231923-J7yjFBB8";

const photo =
  "https://dior85200.github.io/-/2172-20090112.jpg";

const logo =
  "https://dior85200.github.io/-/pj-logo.png";

const chatImage =
  "https://dior85200.github.io/-/codex-clipboard-9c79874c-2a07-4674-a7ab-cab38d0aff33.png";


/* ========================================
   LINE 個人 ID
======================================== */

const lineID =
  "dior85200";


/* ========================================
   通知
======================================== */

const note = x => {

  let n =
    document.querySelector("#n");

  n.textContent =
    x;

  n.classList.add("on");

  setTimeout(() => {

    n.classList.remove("on");

  },2600);

};


/* ========================================
   LINE 好友視窗
======================================== */

function openLineFriend(){

  const overlay =
    document.querySelector("#lineOverlay");

  overlay.classList.add("show");

}


/* ========================================
   關閉 LINE 視窗
======================================== */

function closeLineFriend(event){

  if(
    event &&
    event.target &&
    event.target.id !== "lineOverlay"
  ){
    return;
  }

  const overlay =
    document.querySelector("#lineOverlay");

  overlay.classList.remove("show");

}


/* ========================================
   開啟 LINE

   LINE 官方提供：
   https://line.me/R/nv/addFriends

   這會開啟 LINE 的「加入好友」畫面。
======================================== */

function openLINEApp(){

  window.location.href =
    "https://line.me/R/nv/addFriends";

}


/* ========================================
   複製 LINE ID
======================================== */

async function copyLineID(){

  try{

    await navigator.clipboard.writeText(lineID);

    note(
      "已複製 LINE ID：dior85200"
    );

  }catch(e){

    /*
     * 如果瀏覽器不允許 clipboard，
     * 使用傳統方式複製
     */

    const textarea =
      document.createElement("textarea");

    textarea.value =
      lineID;

    textarea.style.position =
      "fixed";

    textarea.style.opacity =
      "0";

    document.body.appendChild(
      textarea
    );

    textarea.select();

    try{

      document.execCommand(
        "copy"
      );

      note(
        "已複製 LINE ID：dior85200"
      );

    }catch(err){

      note(
        "請手動複製 LINE ID：dior85200"
      );

    }

    textarea.remove();

  }

}


/* ========================================
   ESC 關閉 LINE 視窗
======================================== */

document.addEventListener(
  "keydown",
  function(e){

    if(e.key === "Escape"){

      document
        .querySelector("#lineOverlay")
        .classList.remove("show");

    }

  }
);


/* ========================================
   LIFF 初始化
======================================== */

const ready =
(async()=>{

  try{

    await liff.init({

      liffId:
        "2011231923-J7yjFBB8"

    });

    return liff.isApiAvailable(
      "shareTargetPicker"
    );

  }catch(e){

    return false;

  }

})();


/* ========================================
   分享 LINE 原生名片
======================================== */

async function shareCard(){

  const flex = {

    type:"flex",

    altText:
      "邱瀚生｜品臻鋼鐵有限公司 數位名片",

    contents:{

      type:"bubble",

      hero:{

        type:"image",

        url:photo,

        size:"full",

        aspectRatio:"4:5",

        aspectMode:"cover"

      },

      body:{

        type:"box",

        layout:"vertical",

        contents:[

          {

            type:"text",

            text:
              "品臻鋼鐵有限公司",

            weight:"bold",

            size:"lg",

            color:"#1268A8"

          },

          {

            type:"text",

            text:
              "邱瀚生｜經理",

            weight:"bold",

            size:"xxl",

            margin:"md",

            color:"#123B5C"

          },

          {

            type:"separator",

            margin:"md"

          },

          {

            type:"box",

            layout:"vertical",

            margin:"md",

            spacing:"sm",

            contents:[

              {

                type:"text",

                text:
                  "手機　0930-376-769",

                size:"sm"

              },

              {

                type:"text",

                text:
                  "Email　dior85200@gmail.com",

                size:"sm",

                wrap:true

              },

              {

                type:"text",

                text:
                  "公司電話　04-2335-9496",

                size:"sm"

              },

              {

                type:"text",

                text:
                  "臺中市烏日區北里里太明路成豐巷43號",

                size:"xs",

                color:"#607D8B",

                wrap:true

              }

            ]

          }

        ]

      },


      footer:{

        type:"box",

        layout:"vertical",

        spacing:"sm",

        contents:[

          {

            type:"button",

            style:"primary",

            color:"#1268A8",

            action:{

              type:"uri",

              label:
                "開啟數位名片",

              uri:
                cardUrl

            }

          },

          {

            type:"box",

            layout:"horizontal",

            spacing:"sm",

            contents:[

              {

                type:"button",

                style:"secondary",

                action:{

                  type:"uri",

                  label:
                    "立即致電",

                  uri:
                    "tel:0930376769"

                }

              },

              {

                type:"button",

                style:"secondary",

                action:{

                  type:"uri",

                  label:
                    "Google 地圖",

                  uri:
                    "https://www.google.com/maps/search/?api=1&query=%E8%87%BA%E4%B8%AD%E5%B8%82%E7%83%8F%E6%97%A5%E5%8D%80%E5%8C%97%E9%87%8C%E9%87%8C%E5%A4%AA%E6%98%8E%E8%B7%AF%E6%88%90%E8%B1%90%E5%B7%B743%E8%99%9F"

                }

              }

            ]

          }

        ]

      }

    }

  };


  if(!(await ready)){

    note(
      "此環境不支援 LIFF 分享"
    );

    return;

  }


  try{

    const result =
      await liff.shareTargetPicker(
        [flex],
        {
          isMultiple:true
        }
      );


    if(
      result &&
      result.status === "success"
    ){

      note(
        "名片卡已送出"
      );

    }

    else if(
      result &&
      result.status === "cancel"
    ){

      note(
        "已取消分享"
      );

    }

    else{

      note(
        "請在 LINE 最後一步按傳送"
      );

    }

  }catch(e){

    note(
      "分享失敗：" +
      (
        e.code ||
        e.message ||
        "LINE 拒絕此操作"
      )
    );

  }

}


/* ========================================
   存入通訊錄
======================================== */

function saveContact(){

  let v = [

    "BEGIN:VCARD",

    "VERSION:3.0",

    "FN:邱瀚生",

    "ORG:品臻鋼鐵有限公司",

    "TITLE:經理",

    "TEL;TYPE=CELL:0930376769",

    "TEL;TYPE=WORK:0423359496",

    "EMAIL:dior85200@gmail.com",

    "END:VCARD"

  ].join("\n");


  let a =
    document.createElement("a");


  a.href =
    "data:text/vcard;charset=utf-8," +
    encodeURIComponent(v);


  a.download =
    "邱瀚生_品臻鋼鐵.vcf";


  a.click();


  note(
    "已準備聯絡人檔案"
  );

}

</script>

</body>
</html>
